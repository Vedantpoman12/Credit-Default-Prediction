services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: credit-default-fair:latest
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g

  web:
    build:
      context: ./frontend
    image: credit-default-fair-web:latest
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      API_URL: http://api:8000
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    volumes:
      - web-data:/app/.data
    depends_on:
      - api

volumes:
  web-data:
