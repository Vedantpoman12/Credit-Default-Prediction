name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgomp1
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests
      - name: Performance gate
        run: python -m scripts.evaluate_gates --gate performance
      - name: Fairness gate
        run: python -m scripts.evaluate_gates --gate fairness
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate_results
          path: metrics/gate_results.json

  docker:
    needs: test-and-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/credit-default-fair:latest
          load: true
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/credit-default-fair:latest
